name: Dropshot
options:
  bundleIdPrefix: nz.ghijk
  deploymentTarget:
    macOS: "15.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: B8VB38TXN9
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Dropshot:
    type: application
    platform: macOS
    sources: [Dropshot]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Dropshot/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dropshot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Dropshot records your microphone in screen recordings when you enable it.
        NSScreenCaptureUsageDescription: Dropshot captures your screen for screenshots and recordings.
        CFBundleURLTypes:
          - CFBundleURLName: Dropshot actions
            CFBundleURLSchemes: [dropshot]
        NSServices:
          - NSMenuItem: { default: Upload with Dropshot }
            NSMessage: uploadService
            NSPortName: Dropshot
            NSSendFileTypes: [public.item]
            NSRequiredContext: {}
          - NSMenuItem: { default: Share Text with Dropshot }
            NSMessage: uploadTextService
            NSPortName: Dropshot
            NSSendTypes: [public.utf8-plain-text]
            NSRequiredContext: {}
    entitlements:
      path: Dropshot/Resources/Dropshot.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.ghijk.dropshot
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  DropshotTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DropshotTests]
    dependencies:
      - target: Dropshot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dropshot.app/Contents/MacOS/Dropshot
        BUNDLE_LOADER: $(TEST_HOST)
